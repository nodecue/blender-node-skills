name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Set to true to publish to npm. Leave false for dry-run."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      tag:
        description: "npm dist-tag"
        required: true
        default: "alpha"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Run install smoke test
        run: npm test

      - name: Verify package contents
        run: npm run pack:dry

      - name: Publish dry run
        if: ${{ inputs.publish == 'false' }}
        run: npm publish --dry-run --access public --tag "${{ inputs.tag }}"

      - name: Publish to npm
        if: ${{ inputs.publish == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag "${{ inputs.tag }}"
